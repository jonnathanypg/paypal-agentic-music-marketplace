<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#241442"/>
      <stop offset="50%" stop-color="#0e0720"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>

    <!-- Éxito Vibrant Radiant Gradient (Violet to Electric Cyan to Gold) -->
    <linearGradient id="exitoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Golden Triumph Star Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Tile with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#exitoGrad)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Frequency Ripple Rings (Solfeggio & Binaural Soundwaves) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 8"/>

  <!-- Main Symbol: Flowing "É" + Infinity Mind Loop + Ascending Sound Pillar -->
  <g filter="url(#glow)">
    <!-- Central Audio Frequency Bars forming stylized "E" & Mind Waves -->
    <!-- Bar 1 (Left low shelf) -->
    <rect x="136" y="210" width="22" height="92" rx="11" fill="url(#exitoGrad)"/>
    <!-- Bar 2 (Mid-low) -->
    <rect x="176" y="165" width="22" height="182" rx="11" fill="url(#exitoGrad)"/>
    <!-- Bar 3 (Center High - Beacon of Clarity) -->
    <rect x="216" y="115" width="22" height="282" rx="11" fill="url(#exitoGrad)"/>
    <!-- Bar 4 (Right Core) -->
    <rect x="256" y="80" width="24" height="352" rx="12" fill="url(#exitoGrad)"/>
    <!-- Bar 5 (Harmonic) -->
    <rect x="298" y="145" width="22" height="222" rx="11" fill="url(#exitoGrad)"/>
    <!-- Bar 6 (Upper Mid) -->
    <rect x="338" y="195" width="22" height="122" rx="11" fill="url(#exitoGrad)"/>

    <!-- Dynamic Curved Energy Wave connecting the bars -->
    <path d="M 120 280 C 180 380, 320 380, 380 280 C 330 220, 170 220, 120 280 Z" 
          fill="none" stroke="url(#exitoGrad)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Golden 4-Point Star of Success at Apex -->
  <g filter="url(#softGlow)" transform="translate(268, 62)">
    <path d="M 0 -26 Q 2 -6 20 0 Q 2 6 0 26 Q -2 6 -20 0 Q -2 -6 0 -26 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
  </g>
</svg>
